<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Class Notebook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fahkwang:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/idikai-refresh.css" />
</head>
<body class="class-notebook-body">
  <div id="app-topbar" class="app-topbar">
    <button type="button" id="topbar-hamburger" class="topbar-hamburger" aria-label="Menu" aria-haspopup="true">
      <span></span><span></span><span></span>
    </button>
    <span id="topbar-lang-label" class="topbar-lang-label"></span>
    <div id="topbar-menu" class="topbar-menu" hidden>
      <div class="topbar-menu-heading" data-immersion-key="changeLanguageHeading">Change language</div>
      <button type="button" class="topbar-lang-option" data-lang="es" data-immersion-key="langNameEs">Spanish</button>
    </div>
    <button type="button" id="topbar-notifications" class="topbar-notifications" aria-label="Notifications" aria-haspopup="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"></rect><path d="M3 6.5l9 6.5 9-6.5"></path></svg>
    </button>
    <button type="button" id="hub-todo-toggle" class="topbar-todo" aria-label="To-do list" aria-haspopup="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 12l3 3 5-6"></path></svg>
      <span id="hub-todo-toggle-count" class="hub-todo-toggle-count" hidden></span>
    </button>
    <a href="welcome.html" id="topbar-home" class="topbar-home" aria-label="Language home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
    </a>
    <div id="topbar-notifications-menu" class="topbar-menu topbar-notifications-menu" hidden>
      <div class="topbar-menu-heading" data-immersion-key="notificationsHeading">Notifications</div>
      <p class="topbar-notifications-empty" data-immersion-key="notificationsEmpty">Coming soon — once a teacher connection exists, updates will show up here.</p>
    </div>
    <div id="hub-todo-panel" class="hub-todo-panel" hidden>
      <div id="hub-todo-header" class="hub-todo-header">
        <span class="hub-todo-title" data-immersion-key="todoTitle">To-do list</span>
        <button type="button" id="hub-todo-close" class="hub-todo-close" aria-label="Close">×</button>
      </div>
      <form id="hub-todo-add-form" class="hub-todo-add-form">
        <input type="text" id="hub-todo-add-input" placeholder="Add a task…" autocomplete="off" data-immersion-key="todoAddPlaceholder" />
        <select id="hub-todo-folder-select" class="hub-todo-folder-select" aria-label="Folder">
          <option value="" data-immersion-key="todoNoFolder">No folder</option>
        </select>
        <button type="submit" data-immersion-key="todoAddButton">Add</button>
      </form>
      <div id="hub-todo-groups" class="hub-todo-groups"></div>
      <label class="hub-todo-show-completed">
        <input type="checkbox" id="hub-todo-show-completed" />
        <span data-immersion-key="todoShowCompleted">Show completed</span>
      </label>
    </div>
  </div>
  <div id="app-tab-strip" class="app-tab-strip">
    <div id="app-tab-strip-tabs" class="app-tab-strip-tabs"></div>
    <div class="app-tab-strip-add">
      <button type="button" id="app-tab-plus" class="tab-bar-plus-btn" title="Open another section in a new tab">+</button>
      <div id="app-tab-picker-panel" class="app-tab-picker-panel" hidden>
        <select id="app-tab-section-select">
          <option value="" disabled selected data-immersion-key="tabPickerSectionPlaceholder">Which section?</option>
          <option value="vocab" data-immersion-key="sectionVocab">Vocab Bank</option>
          <option value="grammar" data-immersion-key="sectionGrammar">Grammar</option>
          <option value="writing" data-immersion-key="sectionWriting">Writing</option>
          <option value="speaking" data-immersion-key="sectionSpeaking">Speaking</option>
          <option value="reading" data-immersion-key="sectionReading">Reading</option>
          <option value="personal-hub" data-immersion-key="sectionPersonalHub">Main Hub</option>
          <option value="listening" data-immersion-key="sectionListening">Listening</option>
        </select>
        <select id="app-tab-unit-select" hidden>
          <option value="" disabled selected data-immersion-key="tabPickerUnitPlaceholder">Which one?</option>
        </select>
        <button type="button" id="app-tab-open-btn" class="secondary" hidden data-immersion-key="tabPickerOpen">Open</button>
        <button type="button" id="app-tab-picker-cancel" class="secondary" data-immersion-key="tabPickerCancel">Cancel</button>
      </div>
    </div>
  </div>
  <header class="app-header class-notebook-header" id="class-notebook-header">
    <a href="personal-hub.html" class="back-link" id="class-notebook-back-link" data-immersion-key="backToMainHub">&larr; Back to Main Hub</a>
    <h1 id="class-notebook-heading" data-immersion-key="classNotebookHeading">Class Notebook</h1>
  </header>
  <main class="class-notebook-main">
    <div class="notebook-toolbar" id="notebook-toolbar" role="toolbar" aria-label="Formatting">
      <button type="button" class="notebook-toolbar-btn" id="notebook-undo-btn" title="Undo" aria-label="Undo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button type="button" class="notebook-toolbar-btn" id="notebook-redo-btn" title="Redo" aria-label="Redo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
      <span class="notebook-toolbar-sep" aria-hidden="true"></span>
      <button type="button" class="notebook-toolbar-btn" id="notebook-size-down-btn" title="Smaller text" aria-label="Smaller text">&minus;</button>
      <select class="notebook-size-select" id="notebook-size-select" aria-label="Text size"></select>
      <button type="button" class="notebook-toolbar-btn" id="notebook-size-up-btn" title="Larger text" aria-label="Larger text">+</button>
      <span class="notebook-toolbar-sep" aria-hidden="true"></span>
      <button type="button" class="notebook-toolbar-btn" id="notebook-bold-btn" data-immersion-key="notebookBoldButton" title="Bold"><b>B</b></button>
      <button type="button" class="notebook-toolbar-btn" id="notebook-underline-btn" data-immersion-key="notebookUnderlineButton" title="Underline"><u>U</u></button>
      <button type="button" class="notebook-toolbar-btn" id="notebook-highlight-btn" data-immersion-key="notebookHighlightButton" title="Highlight"><span class="notebook-hl-sample">H</span></button>
      <span class="notebook-toolbar-sep" aria-hidden="true"></span>
      <button type="button" class="notebook-toolbar-btn" id="notebook-link-btn" data-immersion-key="notebookLinkButton" title="Place a link: click here, then click where you want it in the text" aria-label="Place a link">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      </button>
      <button type="button" class="notebook-toolbar-btn notebook-toolbar-wide" id="notebook-picture-btn" title="Insert a picture where your cursor is">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>
        <span>Picture</span>
      </button>
      <input type="file" id="notebook-picture-input" accept="image/png,image/jpeg,image/gif,image/webp" hidden />
      <span class="notebook-toolbar-sep" aria-hidden="true"></span>
      <button type="button" class="notebook-toolbar-btn notebook-toolbar-wide" id="notebook-textbook-btn" title="Open a textbook beside your notes" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>
        <span>Textbook</span>
      </button>
      <span class="notebook-toolbar-spacer"></span>
      <button type="button" class="notebook-toolbar-action notebook-toolbar-action-alt" id="notebook-new-vocab-btn" data-immersion-key="notebookNewVocabButton">New vocab</button>
      <button type="button" class="notebook-toolbar-action" id="notebook-new-grammar-btn" data-immersion-key="notebookNewGrammarButton">New grammar</button>
    </div>

    <div class="notebook-workarea" id="notebook-workarea">
      <div class="notebook-book" id="notebook-book">
        <div class="notebook-page notebook-page-left" id="notebook-page-left">
          <div class="notebook-page-scroll">
            <div class="notebook-page-head">
              <span class="notebook-date-wrap"><button type="button" class="notebook-page-date" id="notebook-left-date" title="Change the date"></button><input type="date" class="notebook-date-input" id="notebook-left-date-input" aria-label="Change the date for this page" tabindex="-1"></span>
              <button type="button" class="notebook-book-tag" id="notebook-left-booktag" hidden></button>
            </div>
            <div
              class="notebook-page-editable"
              id="notebook-left-textarea"
              contenteditable="true"
              data-placeholder="Write your notes here…"
            ></div>
          </div>
          <div class="notebook-page-footer notebook-page-footer-left">
            <button type="button" id="notebook-prev-btn" class="notebook-nav-btn" data-immersion-key="notebookPrevPage" hidden>&larr; Previous page</button>
            <span class="notebook-page-number" id="notebook-left-page-number"></span>
            <button type="button" id="notebook-next-btn-left" class="notebook-nav-btn notebook-nav-next" data-immersion-key="notebookNextPage">Next page &rarr;</button>
          </div>
        </div>
        <div class="notebook-spine" aria-hidden="true"></div>
        <div class="notebook-page notebook-page-right" id="notebook-page-right">
          <div class="notebook-page-scroll">
            <div class="notebook-page-head">
              <span class="notebook-date-wrap"><button type="button" class="notebook-page-date" id="notebook-right-date" title="Change the date"></button><input type="date" class="notebook-date-input" id="notebook-right-date-input" aria-label="Change the date for this page" tabindex="-1"></span>
              <button type="button" class="notebook-book-tag" id="notebook-right-booktag" hidden></button>
            </div>
            <div
              class="notebook-page-editable"
              id="notebook-right-textarea"
              contenteditable="true"
              data-placeholder="Write your notes here…"
            ></div>
          </div>
          <div class="notebook-page-footer notebook-page-footer-right">
            <button type="button" id="notebook-prev-btn-right" class="notebook-nav-btn notebook-nav-prev" data-immersion-key="notebookPrevPage">&larr; Previous page</button>
            <span class="notebook-page-number" id="notebook-right-page-number"></span>
            <button type="button" id="notebook-next-btn" class="notebook-nav-btn" data-immersion-key="notebookNextPage">Next page &rarr;</button>
          </div>
        </div>
      </div>

      <aside class="textbook-panel" id="textbook-panel" aria-label="Textbook" hidden>
        <div class="textbook-head">
          <div class="textbook-head-main">
            <div class="textbook-title" id="textbook-title">Textbook</div>
            <div class="textbook-sub">From your Storage Locker</div>
          </div>
          <button type="button" class="textbook-small-btn" id="textbook-change-btn">Change book</button>
          <button type="button" class="textbook-icon-btn textbook-close-btn" id="textbook-close-btn" aria-label="Close textbook panel">&times;</button>
        </div>
        <div class="textbook-view" id="textbook-view">
          <p class="textbook-status" id="textbook-status"></p>
          <canvas id="textbook-canvas"></canvas>
        </div>
        <div class="textbook-controls">
          <button type="button" class="textbook-icon-btn" id="textbook-prev-btn" aria-label="Previous textbook page">&larr;</button>
          <label class="textbook-page-label">
            <span class="textbook-sr">Go to page</span>
            <input type="text" inputmode="numeric" id="textbook-page-input" value="1" autocomplete="off" />
            <span id="textbook-page-total">of –</span>
          </label>
          <button type="button" class="textbook-icon-btn" id="textbook-next-btn" aria-label="Next textbook page">&rarr;</button>
          <span class="notebook-toolbar-spacer"></span>
          <button type="button" class="textbook-icon-btn" id="textbook-zoom-out-btn" aria-label="Zoom out">&minus;</button>
          <button type="button" class="textbook-icon-btn" id="textbook-zoom-in-btn" aria-label="Zoom in">+</button>
        </div>
        <div class="textbook-link-row">
          <button type="button" class="textbook-link-btn" id="textbook-link-btn"></button>
        </div>
      </aside>
    </div>

    <p class="notebook-save-status" id="notebook-save-status" hidden></p>
    <div id="notebook-link-modal" class="notebook-link-modal" hidden></div>
    <div id="textbook-picker" class="notebook-link-modal" hidden></div>
  </main>
  <script src="js/topbar.js"></script>
  <script src="js/immersion.js"></script>
  <script src="js/app-tabs.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/hub-tasks.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/class-notebook-app.js"></script>
  <script src="js/class-notebook-textbook.js"></script>
</body>
</html>
